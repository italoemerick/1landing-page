<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Landing Page</title>
  <!-- Estilos internos com CSS -->
  <style>
    /* Reset básico para remover margens e paddings padrão */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    /* Container centralizado e responsivo */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }
    /* Cabeçalho com fundo colorido */
    header {
      background-color: #4CAF50;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    /* Seção principal */
    section {
      padding: 20px;
      text-align: center;
    }
    /* Botão de chamada para ação */
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    /* Efeito hover no botão */
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <!-- Cabeçalho da página -->
  <header>
    <h1>Bem-vindo ao meu produto</h1>
    <p>Conheça nossa solução incrível</p>
  </header>
  <!-- Conteúdo principal -->
  <section>
    <h2>Sobre o Produto</h2>
    <p>Descrição do produto, seus benefícios e funcionalidades.</p>
    <button>Saiba Mais</button>
  </section>
</body>
</html>
